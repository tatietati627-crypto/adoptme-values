name: Update Blade Ball Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Автообновление каждые 6 часов

jobs:
  update-bladeball:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Blade Ball Generation Script
        run: node generate_bladeball.js

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'Melanie Studio Bot'
          git config --global user.email 'bot@melaniestudio.internal'
          git add BladeBall/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update Blade Ball database [skip ci]" && git push)
