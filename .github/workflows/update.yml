name: Auto Update Adopt Me Values

on:
  schedule:
    # Запуск каждое воскресенье в полночь (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Позволяет запускать вручную кнопкой в любой момент

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Проверяем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: setup-node@v4
        with:
          node-version: 20

      - name: Запускаем скрипт обновления
        run: node update_values.js

      - name: Коммитим изменения (если появились новые питомцы или цены)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add adoptme_values.json images/pets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: актуализация валют и новых питомцев" && git push)
