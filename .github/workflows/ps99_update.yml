name: Update Pet Simulator 99 Database

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-ps99:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PS99 Generation Script
        run: node generate_ps99.js

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'Melanie Studio Bot'
          git config --global user.email 'bot@melaniestudio.internal'
          git add PetSimulator99/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update Pet Simulator 99 database [skip ci]" && git push)
